name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\openbreak-dotnet
        with:
          global-json-file: global.json
          architecture: x64
          skip-lts-prepass: true
          cache: false

      - name: Test, package, and compile the installer
        run: |
          $output = Join-Path $env:RUNNER_TEMP "openbreak-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $sdk = Join-Path $env:DOTNET_ROOT 'dotnet.exe'
          .\.github\scripts\Build-Windows.ps1 -OutputDirectory $output -ExpectedRevision $env:GITHUB_SHA -DotNetPath $sdk -DownloadCompiler
